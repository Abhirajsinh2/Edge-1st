name: Update Edge 1st dashboard

on:
  workflow_dispatch:
  schedule:
    # Refresh every 15 minutes across the NSE weekday session: 09:00–15:45 IST.
    # GitHub cron runs in UTC (IST = UTC+5:30), so this is 03:30–10:15 UTC, Mon–Fri.
    # GitHub may start scheduled jobs a few minutes late.
    - cron: "30,45 3 * * 1-5"
    - cron: "*/15 4-9 * * 1-5"
    - cron: "0,15 10 * * 1-5"

permissions:
  contents: write

concurrency:
  group: edge-1st-dashboard
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Edge 1st paper refresh
        env:
          UPSTOX_ANALYTICS_TOKEN: ${{ secrets.UPSTOX_ANALYTICS_TOKEN }}
          EDGE1ST_NO_BROWSER: "1"
        run: python edge_1st_bot.py

      - name: Commit refreshed dashboard
        run: |
          cp edge_1st_dashboard.html index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html edge_1st_dashboard.html today.html edge_1st_trades_*.csv
          git diff --cached --quiet || git commit -m "Update Edge 1st dashboard"
          git push
